<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hubungi Kami - Sarawak Dictionary</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #1f1c2c, #928dab);
            color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .nav-buttons {
            margin: 40px auto 20px auto;
            text-align: center;
        }

        .nav-buttons a {
            text-decoration: none;
            margin: 0 10px;
        }

        .nav-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-home {
            background-color: #00d4ff;
            color: #1f1c2c;
        }

        .btn-home:hover {
            background-color: #00aacc;
        }

        .btn-quiz {
            background-color: #facc15;
            color: #1f1c2c;
        }

        .btn-quiz:hover {
            background-color: #eab308;
        }

        .btn-fav {
            background-color: #6b21a8;
            color: #fff;
        }

        .btn-fav:hover {
            background-color: #581c87;
        }

        .contact-container {
            max-width: 600px;
            margin: 0 auto 80px auto;
            background-color: #1f1c2c;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .contact-container h2 {
            color: #facc15;
            text-align: center;
            margin-bottom: 30px;
        }

        .contact-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .contact-container input,
        .contact-container textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            background-color: #2d2a42;
            color: #f5f5f5;
            font-size: 16px;
        }

        .contact-container textarea {
            resize: none;
        }

        .contact-container button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #facc15;
            color: #1f1c2c;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .contact-container button[type="submit"]:hover {
            background-color: #eab308;
        }

        .flash-message {
            text-align: center;
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            margin-top: 30px;
            margin-bottom: -40px;
            border-left: 6px solid #10b981;
            border-radius: 10px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <!-- Butang navigasi atas -->
    <div class="nav-buttons">
        <a href="/"><button class="btn-home">Home</button></a>
        <a href="/quiz"><button class="btn-quiz">Quiz</button></a>
        <a href="/favourites"><button class="btn-fav">Favourites</button></a>
    </div>

    <!-- Flash message -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-message">{{ messages[0] }}</div>
        {% endif %}
    {% endwith %}

    <!-- Borang Contact -->
    <div class="contact-container">
        <h2>Contact Us</h2>
        <form method="POST">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" required>

            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required>

            <label for="message">Message:</label>
            <textarea name="message" id="message" rows="5" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
