<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarawak Dictionary</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #060d1a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }

    nav { display: flex; align-items: center; justify-content: space-between; padding: 0 32px; height: 58px; background: #0c1628; border-bottom: 1px solid #1a3152; }
    .nav-brand { font-size: 17px; font-weight: 700; color: #60a5fa; text-decoration: none; }
    .nav-right { display: flex; gap: 8px; }
    .btn-outline { padding: 6px 16px; font-size: 13px; font-weight: 500; border: 1px solid #1a3152; border-radius: 7px; background: transparent; color: #94a3b8; cursor: pointer; text-decoration: none; transition: border-color .2s, color .2s; }
    .btn-outline:hover { border-color: #3b82f6; color: #60a5fa; }
    .btn-primary { padding: 6px 16px; font-size: 13px; font-weight: 600; border: none; border-radius: 7px; background: #3b82f6; color: #fff; cursor: pointer; text-decoration: none; transition: background .2s; }
    .btn-primary:hover { background: #2563eb; }

    .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 24px; }
    .hero-icon { width: 72px; height: 72px; background: linear-gradient(135deg, #1d4ed8, #3b82f6); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 28px; font-size: 36px; }
    .hero h1 { font-size: 36px; font-weight: 700; color: #fff; margin-bottom: 12px; }
    .hero h1 span { color: #60a5fa; }
    .hero p { font-size: 16px; color: #475569; max-width: 420px; margin-bottom: 36px; line-height: 1.7; }
    .hero-buttons { display: flex; gap: 12px; }
    .btn-hero-primary { padding: 12px 28px; font-size: 15px; font-weight: 600; border: none; border-radius: 9px; background: #3b82f6; color: #fff; cursor: pointer; text-decoration: none; transition: background .2s; }
    .btn-hero-primary:hover { background: #2563eb; }
    .btn-hero-outline { padding: 12px 28px; font-size: 15px; font-weight: 500; border: 1px solid #1a3152; border-radius: 9px; background: transparent; color: #94a3b8; cursor: pointer; text-decoration: none; transition: border-color .2s, color .2s; }
    .btn-hero-outline:hover { border-color: #3b82f6; color: #60a5fa; }

    .search-section { width: 100%; max-width: 560px; margin-top: 48px; }
    .search-bar { display: flex; gap: 8px; }
    .search-bar input { flex: 1; padding: 12px 16px; background: #0c1628; border: 1px solid #1a3152; border-radius: 9px; color: #e2e8f0; font-size: 14px; font-family: inherit; outline: none; transition: border-color .2s, box-shadow .2s; }
    .search-bar input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .search-bar input::placeholder { color: #334155; }
    .search-bar button { padding: 12px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .2s; }
    .search-bar button:hover { background: #2563eb; }
    .search-result { margin-top: 16px; background: #0c1628; border: 1px solid #1a3152; border-radius: 10px; padding: 18px 20px; min-height: 60px; font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-brand">Sarawak Dictionary</a>
    <div class="nav-right">
      <a href="{{ url_for('login') }}" class="btn-outline">Sign In</a>
      <a href="{{ url_for('signup') }}" class="btn-primary">Sign Up</a>
    </div>
  </nav>

  <div class="hero">
    <div class="hero-icon">📖</div>
    <h1>Welcome to the<br><span>Sarawak Dictionary</span></h1>
    <p>Explore the rich languages and dialects of Sarawak. Search, learn, and contribute to our growing dictionary.</p>
    <div class="hero-buttons">
      <a href="{{ url_for('login') }}" class="btn-hero-primary">Get Started</a>
      <a href="{{ url_for('signup') }}" class="btn-hero-outline">Create Account</a>
    </div>

    <div class="search-section">
      <div class="search-bar">
        <input type="text" id="search" placeholder="Search a Sarawak word...">
        <button onclick="cari()">Search</button>
      </div>
      <div class="search-result" id="hasil">Enter a word above to look it up.</div>
    </div>
  </div>

  <script>
    async function cari() {
      const perkataan = document.getElementById('search').value.trim();
      if (!perkataan) return;
      const response = await fetch(`/api/cari?perkataan=${encodeURIComponent(perkataan)}`);
      const data = await response.json();
      const hasil = document.getElementById('hasil');
      if (data) {
        hasil.innerHTML = `<strong style="color:#e2e8f0">${perkataan}</strong> — ${data.maksud_bm}<br><em style="color:#475569">${data.contoh_ayat}</em>`;
      } else {
        hasil.innerHTML = `<span style="color:#334155">No result found for "<strong>${perkataan}</strong>".</span>`;
      }
    }
    document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') cari(); });
  </script>

</body>
</html>
